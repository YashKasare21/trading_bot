[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trading-bot"
version = "0.1.0"
description = "AI-powered trading system for Indian stock markets (NSE/Nifty50)"
requires-python = ">=3.10"
dependencies = [
    "yfinance>=0.2.65",
    "pandas>=2.0.0",
    "numpy>=1.26.0",
    "ta>=0.11.0",
    "requests>=2.32.0",
    "python-dotenv>=1.0.0",
    "apscheduler>=3.10.0",
    "python-telegram-bot>=20.0",
    "newsapi-python>=0.2.7",
    "hmmlearn>=0.3.0",
    "scipy>=1.11.0",
    "quantstats>=0.0.62",
    "sqlalchemy>=2.0.0",
    "joblib>=1.3.0",
    "streamlit>=1.35.0",
    "plotly>=5.20.0",
]

[project.optional-dependencies]
cloud = [
    "psycopg2-binary>=2.9.0",
]
training = [
    "stable-baselines3>=2.6.0",
    "gymnasium>=1.1.1",
    "shimmy>=2.0",
    "optuna>=3.6.0",
    "torch>=2.0.0",
    "FinRL>=0.3.7",
    "vectorbt>=0.26.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    # gymnasium is lightweight (no torch/sb3) — needed to run env tests in CI
    "gymnasium>=1.1.1",
    "shimmy>=2.0",
    "joblib>=1.3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/trading_bot"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
